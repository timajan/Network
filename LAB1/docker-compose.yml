services:
  db:
    image: redis:7-alpine
    container_name: db
    networks:
      - lab1-net

  app:
    build:
      context: .
    container_name: app
    depends_on:
      - db
    networks:
      - lab1-net

  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - lab1-net

networks:
  lab1-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1